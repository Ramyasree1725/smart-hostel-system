version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_soldier_monitor
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/smart_soldier_monitoring
      - JWT_SECRET=tactical_secret_defense_matrix_key_2026
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0-alpine
    container_name: smart_soldier_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local

version: '3.8'

services:
  hostel-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostel-backend-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ./backend:/app/backend
    networks:
      - hostel-network

  hostel-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostel-frontend-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - hostel-backend
    networks:
      - hostel-network

networks:
  hostel-network:
    driver: bridge
